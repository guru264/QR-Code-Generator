<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate QR Code for Digital Restaurent Menu</title>


    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <!-- Bootstrap JS CDN -->
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container">
            <a href="" class="navbar-brand">Generate QR</a>
        </div>
    </nav>
    <!-- QR Code Result -->
    <div class="container mt-5 align-items-center text-center">
        <h2>{{res_name}}</h2>
        <img src="{{qr_url}}" alt="QR code" style="border: 1px solid #ffffff">
        <div>
            <a href="{{qr_url}}" download="{{file_name}}" class="btn btn-primary mt-3"> Download QR Code</a>
            <br>
            <small>Thank you for using our qr code generater tool</small>
        </div>
    </div>
</body>
</html>
